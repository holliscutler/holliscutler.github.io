{%- comment -%} LSTM: one cell, reused; a hidden state of fixed width carried along. {%- endcomment -%}
<svg class="arch__svg" viewBox="0 0 400 152" role="img"
     aria-label="Three identical recurrent cells in a row, each receiving one input and passing a fixed-width hidden state to the next, with an output taken from the last cell.">
  <defs>
    <marker id="ar-ls" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#8a908c"/>
    </marker>
  </defs>

  <!-- three steps of the same cell: identical box, identical weights -->
  <g>
    <rect x="42" y="48" width="74" height="56" rx="6" fill="#fff" stroke="#16181a" stroke-width="1.3"/>
    <rect x="163" y="48" width="74" height="56" rx="6" fill="#fff" stroke="#16181a" stroke-width="1.3"/>
    <rect x="284" y="48" width="74" height="56" rx="6" fill="#fff" stroke="#16181a" stroke-width="1.3"/>
  </g>

  <!-- the gates inside, the same three in every cell -->
  <g fill="#1c4e35" opacity="0.55">
    <circle cx="60" cy="76" r="4"/><circle cx="79" cy="76" r="4"/><circle cx="98" cy="76" r="4"/>
    <circle cx="181" cy="76" r="4"/><circle cx="200" cy="76" r="4"/><circle cx="219" cy="76" r="4"/>
    <circle cx="302" cy="76" r="4"/><circle cx="321" cy="76" r="4"/><circle cx="340" cy="76" r="4"/>
  </g>

  <!-- hidden state handed from cell to cell: same width throughout -->
  <g fill="none" stroke="#1c4e35" stroke-width="2.2" marker-end="url(#ar-ls)">
    <path d="M118 76 L159 76"/>
    <path d="M239 76 L280 76"/>
  </g>
  <text class="arch__tag arch__tag--accent" x="124" y="66">h</text>
  <text class="arch__tag arch__tag--accent" x="245" y="66">h</text>

  <!-- one observation in per step -->
  <g fill="none" stroke="#8a908c" stroke-width="1.2" marker-end="url(#ar-ls)">
    <path d="M79 132 L79 110"/>
    <path d="M200 132 L200 110"/>
    <path d="M321 132 L321 110"/>
    <path d="M321 44 L321 24"/>
  </g>
  <text class="arch__tag" x="70" y="146">x₁</text>
  <text class="arch__tag" x="191" y="146">x₂</text>
  <text class="arch__tag" x="312" y="146">x₃</text>
  <text class="arch__tag" x="313" y="18">ŷ</text>

  <text class="arch__tag" x="42" y="36">same cell, same weights, every step</text>
</svg>
