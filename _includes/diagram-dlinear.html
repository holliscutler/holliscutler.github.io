{%- comment -%} DLinear: a fixed window, decomposed, through one fixed linear map. {%- endcomment -%}
<svg class="arch__svg" viewBox="0 0 400 152" role="img"
     aria-label="A fixed-length input window is split into trend and seasonal components, multiplied by a fixed grid of weights, and projected to a single output value.">
  <defs>
    <marker id="ar-dl" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#8a908c"/>
    </marker>
  </defs>

  <!-- input: a window of fixed length -->
  <rect x="14" y="34" width="76" height="84" rx="3" fill="none"
        stroke="#8a908c" stroke-width="1" stroke-dasharray="3 3"/>
  <polyline points="22,88 30,70 38,96 46,62 54,82 62,56 70,78 78,60 84,72"
            fill="none" stroke="#16181a" stroke-width="1.4" stroke-linejoin="round"/>
  <text class="arch__tag" x="14" y="130">fixed window</text>

  <!-- decomposed into two fixed channels -->
  <polyline points="126,58 150,53 174,49 196,45" fill="none" stroke="#5c615e" stroke-width="1.3"/>
  <polyline points="126,104 134,96 142,112 150,96 158,112 166,96 174,112 182,96 196,104"
            fill="none" stroke="#5c615e" stroke-width="1.3" stroke-linejoin="round"/>
  <text class="arch__tag" x="126" y="38">trend</text>
  <text class="arch__tag" x="126" y="130">seasonal</text>

  <!-- the linear map: a grid of weights whose dimensions never change -->
  <g fill="#1c4e35">
    <rect x="236" y="42" width="11" height="11" rx="1.5" opacity=".75"/>
    <rect x="250" y="42" width="11" height="11" rx="1.5" opacity=".30"/>
    <rect x="264" y="42" width="11" height="11" rx="1.5" opacity=".55"/>
    <rect x="278" y="42" width="11" height="11" rx="1.5" opacity=".20"/>
    <rect x="236" y="56" width="11" height="11" rx="1.5" opacity=".35"/>
    <rect x="250" y="56" width="11" height="11" rx="1.5" opacity=".80"/>
    <rect x="264" y="56" width="11" height="11" rx="1.5" opacity=".25"/>
    <rect x="278" y="56" width="11" height="11" rx="1.5" opacity=".60"/>
    <rect x="236" y="70" width="11" height="11" rx="1.5" opacity=".50"/>
    <rect x="250" y="70" width="11" height="11" rx="1.5" opacity=".22"/>
    <rect x="264" y="70" width="11" height="11" rx="1.5" opacity=".70"/>
    <rect x="278" y="70" width="11" height="11" rx="1.5" opacity=".40"/>
    <rect x="236" y="84" width="11" height="11" rx="1.5" opacity=".28"/>
    <rect x="250" y="84" width="11" height="11" rx="1.5" opacity=".62"/>
    <rect x="264" y="84" width="11" height="11" rx="1.5" opacity=".33"/>
    <rect x="278" y="84" width="11" height="11" rx="1.5" opacity=".78"/>
  </g>
  <rect x="231" y="37" width="63" height="63" rx="3" fill="none" stroke="#1c4e35" stroke-width="1"/>
  <text class="arch__tag" x="231" y="114">fixed weights</text>

  <!-- output -->
  <circle cx="366" cy="68" r="6" fill="#fff" stroke="#16181a" stroke-width="1.4"/>
  <text class="arch__tag" x="352" y="92">ŷ</text>

  <g fill="none" stroke="#8a908c" stroke-width="1.2" marker-end="url(#ar-dl)">
    <path d="M96 76 L118 76"/>
    <path d="M204 76 L224 76"/>
    <path d="M300 68 L354 68"/>
  </g>
</svg>
