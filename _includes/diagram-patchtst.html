{%- comment -%} PatchTST: a fixed patch grid, attention across tokens. {%- endcomment -%}
<svg class="arch__svg" viewBox="0 0 400 152" role="img"
     aria-label="A series is cut into a fixed grid of four patches, each becoming a token; attention relates every token to every other, and a head projects the result to an output.">
  <defs>
    <marker id="ar-pt" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#8a908c"/>
    </marker>
  </defs>

  <!-- the series, cut on a fixed grid -->
  <polyline points="18,118 30,104 42,124 54,98 66,116 78,92 90,112 102,96 114,118 126,100 138,114 150,104"
            fill="none" stroke="#16181a" stroke-width="1.3" stroke-linejoin="round"/>
  <g fill="none" stroke="#8a908c" stroke-width="1" stroke-dasharray="3 3">
    <rect x="15" y="88" width="35" height="42" rx="2"/>
    <rect x="52" y="88" width="35" height="42" rx="2"/>
    <rect x="89" y="88" width="35" height="42" rx="2"/>
    <rect x="126" y="88" width="35" height="42" rx="2"/>
  </g>
  <text class="arch__tag" x="15" y="146">fixed patch grid</text>

  <!-- each patch becomes one token -->
  <g fill="#1c4e35" opacity="0.8">
    <rect x="22" y="48" width="22" height="22" rx="3"/>
    <rect x="59" y="48" width="22" height="22" rx="3"/>
    <rect x="96" y="48" width="22" height="22" rx="3"/>
    <rect x="133" y="48" width="22" height="22" rx="3"/>
  </g>
  <g fill="none" stroke="#8a908c" stroke-width="1" marker-end="url(#ar-pt)">
    <path d="M33 86 L33 74"/><path d="M70 86 L70 74"/>
    <path d="M107 86 L107 74"/><path d="M144 86 L144 74"/>
  </g>

  <!-- attention: every token related to every other, with learned weights -->
  <g fill="none" stroke="#2f7a52" stroke-width="0.9" opacity="0.5">
    <path d="M33 48 Q51 20 70 48"/>
    <path d="M70 48 Q88 20 107 48"/>
    <path d="M107 48 Q125 20 144 48"/>
    <path d="M33 48 Q70 8 107 48"/>
    <path d="M70 48 Q107 8 144 48"/>
    <path d="M33 48 Q88 0 144 48"/>
  </g>
  <text class="arch__tag arch__tag--accent" x="186" y="26">attention</text>

  <!-- head -->
  <rect x="246" y="46" width="58" height="46" rx="4" fill="#fff" stroke="#16181a" stroke-width="1.3"/>
  <text class="arch__tag" x="256" y="74">head</text>
  <circle cx="366" cy="69" r="6" fill="#fff" stroke="#16181a" stroke-width="1.4"/>
  <text class="arch__tag" x="352" y="92">ŷ</text>

  <g fill="none" stroke="#8a908c" stroke-width="1.2" marker-end="url(#ar-pt)">
    <path d="M166 59 L242 59"/>
    <path d="M308 69 L354 69"/>
  </g>
</svg>
