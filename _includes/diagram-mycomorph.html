{%- comment -%}
MycoMorph, drawn in the same left-to-right form as the three conventional
architectures so the comparison is like-for-like. The difference is the last
stage: a graph shown at three moments, growing, with one path reinforced.
{%- endcomment -%}
<svg class="arch__svg" viewBox="0 0 400 190" role="img"
     aria-label="A stream passes through a smoother and a delay embedding into a graph. The graph is shown at three successive moments, growing larger each time, with one path thickening as it is re-traversed.">
  <defs>
    <marker id="ar-mm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#8a908c"/>
    </marker>
  </defs>

  <!-- 1 · the stream -->
  <polyline points="14,46 24,34 34,54 44,30 54,50 64,28 74,48 82,38"
            fill="none" stroke="#16181a" stroke-width="1.3" stroke-linejoin="round"/>
  <text class="arch__tag" x="14" y="70">stream</text>

  <!-- 2 · smoother -->
  <rect x="104" y="22" width="58" height="34" rx="4" fill="#fff" stroke="#16181a" stroke-width="1.3"/>
  <text class="arch__tag" x="113" y="43">smooth</text>

  <!-- 3 · delay embedding -->
  <g stroke="#16181a" stroke-width="1.1" fill="none">
    <path d="M196 52 L196 26"/><path d="M196 52 L222 52"/><path d="M196 52 L178 64"/>
  </g>
  <circle cx="210" cy="34" r="2.6" fill="#c44830"/>
  <circle cx="202" cy="44" r="2.6" fill="#c44830"/>
  <circle cx="214" cy="46" r="2.6" fill="#c44830"/>
  <text class="arch__tag" x="178" y="76">embed</text>

  <!-- 4 · prediction -->
  <circle cx="366" cy="39" r="6" fill="#fff" stroke="#16181a" stroke-width="1.4"/>
  <text class="arch__tag" x="352" y="62">ŷ</text>

  <g fill="none" stroke="#8a908c" stroke-width="1.2" marker-end="url(#ar-mm)">
    <path d="M90 39 L100 39"/>
    <path d="M166 39 L186 39"/>
    <path d="M232 39 L262 39"/>
    <path d="M336 39 L354 39"/>
  </g>

  <!-- the graph stage, drawn at three successive moments -->
  <rect x="266" y="18" width="66" height="42" rx="4" fill="#f1f0ea" stroke="#1c4e35" stroke-width="1.2"/>
  <g stroke="#5c615e" stroke-width="0.9" fill="none">
    <path d="M280 48 L292 32 L306 42 L318 28"/>
    <path d="M292 32 L300 52"/>
  </g>
  <g fill="#c44830"><circle cx="280" cy="48" r="2"/><circle cx="292" cy="32" r="2"/>
    <circle cx="306" cy="42" r="2"/><circle cx="318" cy="28" r="2"/><circle cx="300" cy="52" r="2"/></g>
  <text class="arch__tag arch__tag--accent" x="266" y="76">graph</text>

  <!-- ...and how that graph changes, which is the whole point -->
  <line x1="14" y1="100" x2="386" y2="100" stroke="#e2e0d8" stroke-width="1"/>
  <text class="arch__tag" x="14" y="118">the same stage, three moments apart</text>

  <!-- t1 -->
  <g stroke="#5c615e" stroke-width="0.9" fill="none">
    <path d="M38 158 L52 142 L68 150"/>
  </g>
  <g fill="#c44830"><circle cx="38" cy="158" r="2"/><circle cx="52" cy="142" r="2"/><circle cx="68" cy="150" r="2"/></g>
  <text class="arch__tag" x="36" y="180">t₁</text>

  <!-- t2 -->
  <g stroke="#5c615e" stroke-width="0.9" fill="none">
    <path d="M150 162 L164 140 L184 148 L196 134"/>
    <path d="M164 140 L176 164"/>
    <path d="M184 148 L176 164"/>
  </g>
  <g fill="#c44830"><circle cx="150" cy="162" r="2"/><circle cx="164" cy="140" r="2"/>
    <circle cx="184" cy="148" r="2"/><circle cx="196" cy="134" r="2"/><circle cx="176" cy="164" r="2"/></g>
  <text class="arch__tag" x="168" y="180">t₂</text>

  <!-- t3: bigger, and one circuit now carries most of the flow -->
  <g stroke="#5c615e" stroke-width="0.9" fill="none" opacity="0.75">
    <path d="M286 158 L298 128 L324 120 L344 132 L338 158 L310 166 Z"/>
    <path d="M298 128 L324 142"/>
    <path d="M344 132 L310 166"/>
    <path d="M286 158 L324 120"/>
  </g>
  <path d="M298 128 L324 120 L344 132 L338 158" fill="none" stroke="#00c4ce" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#c44830">
    <circle cx="286" cy="158" r="2"/><circle cx="298" cy="128" r="2"/><circle cx="324" cy="120" r="2"/>
    <circle cx="344" cy="132" r="2"/><circle cx="338" cy="158" r="2"/><circle cx="310" cy="166" r="2"/>
    <circle cx="324" cy="142" r="2"/>
  </g>
  <text class="arch__tag" x="310" y="180">t₃</text>

  <g fill="none" stroke="#8a908c" stroke-width="1" marker-end="url(#ar-mm)" opacity="0.8">
    <path d="M88 152 L136 152"/>
    <path d="M214 152 L268 152"/>
  </g>
</svg>
